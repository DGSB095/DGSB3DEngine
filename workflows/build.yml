name: Build Rust

on:
  workflowdispatch:

  jobs:
    build:
      runs-on: windows-latest

      steps:
        - uses: actions/checkout@v4

        - uses: dtolnay/rust-toolchain@stable

        - name: Build
          run: cargo build --release

        - mame: Upload executable
          uses: actions/upload-artifact@v4
          with:
            name: WindowsBuild
            path: target/release/*.exe
